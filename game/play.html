<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bubble Cannon — играть</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #phone{position:relative;width:min(100vw,calc((100vh - 74px) * 9 / 16));height:min(calc(100vh - 74px),calc(100vw * 16 / 9));
         background:#000;border-radius:28px;overflow:hidden;box-shadow:0 0 0 10px #171d25,0 0 0 12px #2a3441,0 30px 70px rgba(0,0,0,.75)}
  #phone iframe{display:block;width:100%;height:100%;border:0}
  .hint{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:#5d6b7a;font:14px/1.4 system-ui,sans-serif;pointer-events:none}
  .back{position:fixed;top:14px;left:14px;color:#8fa0b3;font:14px system-ui,sans-serif;text-decoration:none;z-index:5;
        background:rgba(20,26,34,.85);border:1px solid #2a3441;padding:7px 12px;border-radius:10px}
  @media (max-aspect-ratio: 9/16), (max-width: 560px){
    #phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}
    .hint,.back{display:none}
  }
</style>
</head>
<body>
<a class="back" href="../index.html">← На страницу игры</a>
<div id="stage"><div id="phone"><iframe src="index.html" title="Bubble Cannon" allow="autoplay; fullscreen"></iframe></div></div>
<div class="hint">Игра для телефона — на компьютере она запускается в рамке. Нажмите внутри, чтобы играть.</div>
</body>
</html>
